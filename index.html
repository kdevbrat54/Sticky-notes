<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>महत्वपूर्ण नोट</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #f0f8ff;
        }

        .sticky-note {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            max-height: 150px;
            background-color: #FFFFFF;
            color: #87CEEB;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(135, 206, 235, 0.5);
            font-family: Arial, sans-serif;
            font-size: 14px;
            overflow-y: auto;
            z-index: 9999;
            border-left: 5px solid #87CEEB;
        }

        .sticky-note h4 {
            margin: 0 0 5px 0;
            font-size: 15px;
            color: #007BFF;
        }
    </style>
</head>
<body>

    <div class="sticky-note">
        <h4>important notes</h4>
        <p>notes which very important</p>
    </div>

</body>
</html>
