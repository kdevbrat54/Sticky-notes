<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Sticky Notes</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* HOME BOARD */
body {
    background: #eef7ff;
}

header {
    height: 65px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: relative;
    z-index: 10000;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #007bff;
}

#addNote {
    border: none;
    background: #007bff;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

/* BOARD */
#board {
    position: absolute;
    top: 65px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
}

/* NOTE */
.note {
    position: absolute;
    width: 250px;
    min-height: 180px;
    background: #fff;
    border-left: 5px solid #87ceeb;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.18);
    padding: 12px;
    touch-action: none;
    user-select: none;
}

/* NOTE HEADER */
.note-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    cursor: grab;
}

.note-header:active {
    cursor: grabbing;
}

.note-title {
    width: 180px;
    border: none;
    border-bottom: 2px solid #87ceeb;
    outline: none;
    font-size: 16px;
    font-weight: bold;
    padding: 5px;
    background: transparent;
}

.delete {
    border: none;
    background: #ff4d4d;
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    cursor: pointer;
}

/* NOTE TEXT */
.note-text {
    width: 100%;
    height: 105px;
    resize: none;
    border: 1px solid #ddd;
    border-radius: 5px;
    outline: none;
    padding: 8px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    background: #fff;
    user-select: text;
}

/* EMPTY */
.empty {
    position: absolute;
    top: 45%;
    width: 100%;
    text-align: center;
    color: #777;
    font-size: 17px;
}

/* MOBILE */
@media (max-width: 600px) {

    header {
        height: 60px;
    }

    .logo {
        font-size: 18px;
    }

    #addNote {
        padding: 9px 12px;
        font-size: 14px;
    }

    #board {
        top: 60px;
    }

    .note {
        width: 230px;
    }

    .note-title {
        width: 160px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        📝 Sticky Notes
    </div>

    <button id="addNote">
        ＋ New Note
    </button>

</header>

<div id="board"></div>

<script>

const board = document.getElementById("board");
const addButton = document.getElementById("addNote");

const STORAGE_KEY = "my_sticky_notes_board";

let notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];


/* SAVE */
function saveNotes() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(notes)
    );
}


/* CREATE NOTE */
function createNote(note) {

    const element = document.createElement("div");

    element.className = "note";

    element.style.left = note.x + "px";
    element.style.top = note.y + "px";

    element.innerHTML = `

        <div class="note-header">

            <input
                class="note-title"
                type="text"
                value="${escapeHTML(note.title)}"
                placeholder="Title"
            >

            <button class="delete">
                🗑
            </button>

        </div>

        <textarea
            class="note-text"
            placeholder="यहाँ अपना note लिखें..."
        >${escapeHTML(note.text)}</textarea>

    `;

    board.appendChild(element);


    const title =
        element.querySelector(".note-title");

    const text =
        element.querySelector(".note-text");

    const deleteButton =
        element.querySelector(".delete");

    const header =
        element.querySelector(".note-header");


    /* SAVE TEXT */
    title.addEventListener("input", () => {

        note.title = title.value;

        saveNotes();

    });


    text.addEventListener("input", () => {

        note.text = text.value;

        saveNotes();

    });


    /* DELETE */
    deleteButton.addEventListener("click", (event) => {

        event.stopPropagation();

        notes = notes.filter(
            n => n.id !== note.id
        );

        saveNotes();

        element.remove();

        checkEmpty();

    });


    /* DRAG */
    let dragging = false;

    let startX = 0;
    let startY = 0;

    let originalX = 0;
    let originalY = 0;


    header.addEventListener(
        "pointerdown",
        startDrag
    );


    function startDrag(event) {

        dragging = true;

        header.setPointerCapture(
            event.pointerId
        );

        startX = event.clientX;
        startY = event.clientY;

        originalX = note.x;
        originalY = note.y;

        element.style.zIndex =
            Date.now();

    }


    header.addEventListener(
        "pointermove",
        drag
    );


    function drag(event) {

        if (!dragging) return;

        const dx =
            event.clientX - startX;

        const dy =
            event.clientY - startY;

        let newX =
            originalX + dx;

        let newY =
            originalY + dy;


        /* BOARD LIMITS */

        const maxX =
            board.clientWidth -
            element.offsetWidth;

        const maxY =
            board.clientHeight -
            element.offsetHeight;


        newX =
            Math.max(
                0,
                Math.min(newX, maxX)
            );

        newY =
            Math.max(
                0,
                Math.min(newY, maxY)
            );


        note.x = newX;
        note.y = newY;

        element.style.left =
            newX + "px";

        element.style.top =
            newY + "px";

    }


    header.addEventListener(
        "pointerup",
        stopDrag
    );

    header.addEventListener(
        "pointercancel",
        stopDrag
    );


    function stopDrag() {

        if (!dragging) return;

        dragging = false;

        saveNotes();

    }

}


/* ADD NEW NOTE */
addButton.addEventListener(
    "click",
    () => {

        const note = {

            id:
                Date.now(),

            title:
                "New Note",

            text:
                "",

            x:
                30 + Math.random() * 80,

            y:
                30 + Math.random() * 80

        };


        notes.push(note);

        saveNotes();

        createNote(note);

        checkEmpty();

    }
);


/* ESCAPE HTML */
function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* EMPTY MESSAGE */
function checkEmpty() {

    const old =
        document.querySelector(".empty");

    if (old) old.remove();


    if (notes.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.innerHTML =
            "📝 अभी कोई note नहीं है<br>＋ New Note दबाकर note बनाएं";

        board.appendChild(empty);

    }

}


/* LOAD SAVED NOTES */

notes.forEach(
    note => createNote(note)
);

checkEmpty();

</script>

</body>
</html>
